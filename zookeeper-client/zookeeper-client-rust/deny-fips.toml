# The cargo-deny policy for the FIPS builds. deny.toml holds the policy
# for all other builds. The two files differ in the feature list, the
# license exception, the aws-lc-fips-sys entry and the duplicate versions.
#
# Run it from the workspace directory:
#
#     cargo deny --locked --config deny-fips.toml check
#
# The graph has all workspace crates, with their dev-dependencies. The
# feature list below is the union of the FIPS feature sets. The FIPS
# provider rejects the platform verifier, so its three entries in `deny`
# give "not encountered" warnings.

[graph]
# The supported targets of the three tiers, without Windows. Keep this
# list equal to the targets of the closure inventories in
# supply-chain/closure.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "i686-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "s390x-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-freebsd",
]
all-features = false
no-default-features = false
features = [
    "zk-ffi/tls-aws-lc-rs-fips",
    "zk-ffi/sasl",
    "apache-zookeeper/blocking",
    "apache-zookeeper/log",
    "apache-zookeeper/serde",
    "apache-zookeeper/tls-aws-lc-rs-fips",
    "apache-zookeeper/sasl-gssapi",
]

[output]
feature-depth = 1

# The RustSec advisory database. A vulnerability, an unsound crate, an
# unmaintained crate or a yanked version stops the check. To accept an
# advisory, add its ID to `ignore` with a reason.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

# The approved licenses. They are Apache category A licenses with no
# copyleft terms. For a crate with a license choice, one approved
# alternative is sufficient. A different license needs project approval
# and an entry in `exceptions`.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The project approves the OpenSSL license of the AWS-LC FIPS module for
# the FIPS builds only.
exceptions = [
    { crate = "aws-lc-fips-sys", allow = ["OpenSSL"] },
]
# A license entry that no crate uses is not an error. The list is the
# project policy, not a list of the current licenses.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # The C drop-in libraries must not link OpenSSL. The TLS code uses
    # rustls and a Rust crypto provider.
    { crate = "openssl", reason = "the libraries do not use OpenSSL" },
    { crate = "openssl-sys", reason = "the libraries do not use OpenSSL" },
    { crate = "native-tls", reason = "the TLS code uses rustls only" },
    # The TLS code parses PEM through pem-rfc7468.
    { crate = "rustls-pemfile", reason = "unmaintained; pem-rfc7468 parses PEM" },
    # The trust anchors come from the configuration, not from a bundle.
    { crate = "webpki-roots", reason = "the build bundles no trust anchors" },
    # Only aws-lc-rs links the FIPS module.
    { crate = "aws-lc-fips-sys", wrappers = ["aws-lc-rs"], reason = "aws-lc-rs is the only user" },
    # No FIPS feature set includes the platform verifier, so a FIPS
    # closure contains it and the crates below it in no case.
    { crate = "rustls-platform-verifier", reason = "no FIPS feature set includes the platform verifier" },
    { crate = "rustls-native-certs", reason = "only the platform verifier uses it" },
    { crate = "openssl-probe", reason = "only the platform verifier uses it" },
]
# Each duplicate major version needs a reason. Add an entry only when the
# upstream crates cannot agree on one version.
skip = [
    { crate = "shlex@1.3.0", reason = "bindgen 0.71, a build dependency of libgssapi-sys, needs shlex 1; cc needs shlex 2" },
    { crate = "syn@2.0.119", reason = "bindgen 0.71, a build dependency of libgssapi-sys, needs syn 2; serde_derive and tokio-macros need syn 3" },
    { crate = "bindgen@0.71.1", reason = "libgssapi-sys builds with bindgen 0.71; aws-lc-fips-sys builds with bindgen 0.73" },
    { crate = "prettyplease@0.2.37", reason = "bindgen 0.71 needs prettyplease 0.2; bindgen 0.73 needs prettyplease 0.3" },
]
skip-tree = []

# crates.io is the only package source.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
