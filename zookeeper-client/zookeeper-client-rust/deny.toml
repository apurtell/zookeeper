# The cargo-deny policy for every build without the FIPS provider.
# deny-fips.toml holds the policy for the FIPS builds.
#
# Run it from the workspace directory:
#
#     cargo deny --locked check
#
# The graph has all workspace crates, with their dev-dependencies. The
# feature list below is the union of the non-FIPS feature sets. Each check
# is monotonic, so a pass on the union is a pass on each feature set.
# Cargo metadata accepts the two TLS providers together. Only a compile
# rejects that combination.

[graph]
# The supported targets of the three tiers, without Windows. Keep this
# list equal to the targets of the closure inventories in
# supply-chain/closure.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "i686-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "s390x-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-freebsd",
]
all-features = false
no-default-features = false
features = [
    "zk-ffi/tls-ring",
    "zk-ffi/tls-aws-lc-rs",
    "zk-ffi/sasl",
    "apache-zookeeper/blocking",
    "apache-zookeeper/log",
    "apache-zookeeper/serde",
    "apache-zookeeper/tls-ring",
    "apache-zookeeper/tls-aws-lc-rs",
    "apache-zookeeper/tls-platform-verifier",
    "apache-zookeeper/sasl-gssapi",
]

[output]
feature-depth = 1

# The RustSec advisory database. A vulnerability, an unsound crate, an
# unmaintained crate or a yanked version stops the check. To accept an
# advisory, add its ID to `ignore` with a reason.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

# The approved licenses. They are Apache category A licenses with no
# copyleft terms. For a crate with a license choice, one approved
# alternative is sufficient. A different license needs project approval
# and an entry in `exceptions`.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
exceptions = []
# A license entry that no crate uses is not an error. The list is the
# project policy, not a list of the current licenses.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [
    # The C drop-in libraries must not link OpenSSL. The TLS code uses
    # rustls and a Rust crypto provider.
    { crate = "openssl", reason = "the libraries do not use OpenSSL" },
    { crate = "openssl-sys", reason = "the libraries do not use OpenSSL" },
    { crate = "native-tls", reason = "the TLS code uses rustls only" },
    # The TLS code parses PEM through pem-rfc7468.
    { crate = "rustls-pemfile", reason = "unmaintained; pem-rfc7468 parses PEM" },
    # The trust anchors come from the configuration, not from a bundle.
    { crate = "webpki-roots", reason = "the build bundles no trust anchors" },
    # Only the FIPS builds use the FIPS module. deny-fips.toml permits it.
    { crate = "aws-lc-fips-sys", reason = "deny-fips.toml covers the FIPS builds" },
    # The platform verifier stays in the native client. The drop-in
    # libraries never link it, or the crates below it.
    { crate = "rustls-platform-verifier", wrappers = ["apache-zookeeper"], reason = "native client only" },
    { crate = "rustls-native-certs", wrappers = ["rustls-platform-verifier"], reason = "platform verifier only" },
    { crate = "openssl-probe", wrappers = ["rustls-native-certs"], reason = "platform verifier only" },
]
# Each duplicate major version needs a reason. Add an entry only when the
# upstream crates cannot agree on one version.
skip = [
    { crate = "shlex@1.3.0", reason = "bindgen 0.71, a build dependency of libgssapi-sys, needs shlex 1; cc needs shlex 2" },
    { crate = "syn@2.0.119", reason = "bindgen 0.71, a build dependency of libgssapi-sys, needs syn 2; serde_derive and tokio-macros need syn 3" },
]
skip-tree = []

# crates.io is the only package source.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
