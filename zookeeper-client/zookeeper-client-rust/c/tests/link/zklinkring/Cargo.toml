# The unrelated Rust staticlib of LINK-01 for the TLS configurations.
# It has its own std, rustls and ring. It is not a
# member of the Rust client workspace. The versions are the workspace
# versions, and Cargo.lock pins them for a --locked --offline build.

[package]
name = "zklinkring"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
ring = { version = "0.17.14", default-features = false }
rustls = { version = "0.23.31", default-features = false, features = ["std", "ring", "tls12"] }

[profile.release]
panic = "abort"
opt-level = 1

[workspace]
