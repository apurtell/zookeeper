# The cargo-fuzz targets of the Rust client. The crate is outside the
# main workspace: it needs a nightly toolchain and the libFuzzer runtime,
# and it has its own lock file.

[package]
name = "zk-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
libc = { version = "0.2", default-features = false }
zk-jute = { path = "../crates/zk-jute" }
zk-proto = { path = "../crates/zk-proto" }
zk-driver = { path = "../crates/zk-driver", features = ["tls-ring"] }
apache-zookeeper = { path = "../crates/zk-client", default-features = false, features = ["sasl"] }
rustls = { version = "0.23.31", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pki-types = { version = "1.12", default-features = false, features = ["std"] }
# The key target reads the PBES2 parameters itself, to skip costly keys.
pkcs8 = { version = "0.10.2", default-features = false, features = ["alloc", "pkcs5"] }
pkcs5 = { version = "0.7", default-features = false, features = ["alloc"] }
# The DIGEST-MD5 target computes the correct rspauth of each response.
md-5 = { version = "0.10.6", default-features = false }
# The TLS stream target and the seed generator make their certificates
# with the test kit, which runs OpenSSL once and caches the result.
zk-testkit = { path = "../crates/zk-testkit" }

[[example]]
name = "gen_seeds"
path = "examples/gen_seeds.rs"

[[bin]]
name = "jute_records"
path = "fuzz_targets/jute_records.rs"
test = false
doc = false
bench = false

