[package]
name = "zk-xcheck"
description = "Cross-checks of the Rust ports against the legacy C client sources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The crate links C code, so it cannot inherit the workspace rule that
# forbids unsafe code. Only the two FFI modules may use unsafe code.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
ptr_as_ptr = "deny"
large_stack_arrays = "deny"
large_stack_frames = "deny"

[dependencies]
zk-jute.workspace = true
zk-proto.workspace = true

[build-dependencies]
cc = "1"
