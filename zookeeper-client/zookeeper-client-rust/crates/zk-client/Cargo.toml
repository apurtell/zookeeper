[package]
name = "apache-zookeeper"
description = "Native Rust client for Apache ZooKeeper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "apache_zookeeper"

[dependencies]
zk-jute.workspace = true
zk-proto.workspace = true
zk-driver = { workspace = true, features = ["std-thread"] }
bitflags.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
# Safe uid and gid reads for the TLS environment rule.
rustix = { workspace = true, features = ["std", "process", "use-libc"] }
# The public TLS API names rustls types.
rustls = { workspace = true, optional = true, features = ["std", "tls12"] }
tracing = { workspace = true, optional = true, features = ["std"] }
log = { workspace = true, optional = true, features = ["std"] }
futures-core = { workspace = true, optional = true }
# Serialize and Deserialize for the value types.
serde = { workspace = true, optional = true, features = ["std", "derive"] }
# Native DIGEST-MD5: the response digest and the client nonce.
md-5 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true, features = ["std"] }
# Native GSSAPI. It links the system libgssapi_krb5.
libgssapi = { workspace = true, optional = true }
# The OS trust store and the OS verification policy.
rustls-platform-verifier = { workspace = true, optional = true }

# The tokio driver exists only on Unix. On other targets the `tokio`
# feature compiles to nothing.
[target.'cfg(unix)'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt", "net", "time", "sync", "io-util"] }

[dev-dependencies]
# `tls` gives `TlsAcceptor` for the TLS tests. The test gives the provider.
zk-fakeserver = { workspace = true, features = ["tls"] }
zk-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
proptest = { workspace = true, features = ["std"] }

# Builds never use --all-features: exactly one TLS provider feature is
# allowed.
[features]
default = ["tokio", "tracing", "stream"]
tokio = ["dep:tokio", "zk-driver/tokio"]
tracing = ["dep:tracing"]
stream = ["dep:futures-core"]
blocking = []
log = ["dep:log"]
tls-rustls = ["dep:rustls", "zk-driver/tls"]
tls-ring = ["tls-rustls", "zk-driver/tls-ring"]
tls-aws-lc-rs = ["tls-rustls", "zk-driver/tls-aws-lc-rs"]
tls-aws-lc-rs-fips = ["tls-rustls", "zk-driver/tls-aws-lc-rs-fips"]
# `with_platform_verifier` verifies through rustls-platform-verifier. It
# needs `tls-ring` or `tls-aws-lc-rs`. With `tls-aws-lc-rs-fips` the build
# stops.
tls-platform-verifier = ["tls-rustls", "dep:rustls-platform-verifier"]
# Serialize and Deserialize for Stat, Acl, Id, Perms, Zxid, SessionId and
# CreateMode.
serde = ["dep:serde"]
# Native SASL. `sasl` gives DIGEST-MD5 and custom mechanisms.
# `sasl-gssapi` adds Kerberos through the system GSSAPI library.
sasl = ["dep:md-5", "dep:getrandom"]
sasl-gssapi = ["sasl", "dep:libgssapi"]
