[package]
name = "apache-zookeeper-recipes"
description = "Coordination recipes for Apache ZooKeeper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "apache_zookeeper_recipes"

# The only normal dependency is the client, with no features.
# The crate has no runtime, timer or UUID dependency of its own.
[dependencies]
apache-zookeeper.workspace = true

# The tests run the client on its own IO thread (`Runtime::Thread`), so
# they need no client feature. tokio gives the test executor and its
# timeouts only. zk-fakeserver is the in-process model server of the
# model-level tests.
[dev-dependencies]
zk-fakeserver.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }

# The Curator interop peer. The JUnit test in `interop/curator` starts
# it as a process.
[[example]]
name = "interop_peer"
path = "examples/interop_peer.rs"
